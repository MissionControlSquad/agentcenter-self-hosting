name: Feature request
description: Propose a concrete, scoped change. For open-ended ideas, start a discussion instead.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Rough or open-ended ideas work better as a [discussion](https://github.com/MissionControlSquad/agentcenter-self-hosting/discussions/categories/ideas).
        Use this form once you can describe the problem and the change you want.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should change? Include the behaviour, config or API you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today or other approaches you ruled out, and why.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you open a pull request for this?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
    validations:
      required: true
